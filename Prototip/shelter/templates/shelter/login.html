{% extends 'shelter/base.html' %}
{% block title %}Prijava{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title mb-3">Prijava</h2>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    <div class="mb-3">
                        {{ form.username.label_tag }}
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        {{ form.password.label_tag }}
                        {{ form.password }}
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Prijavi se</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'register_volunteer' %}">Registriraj se kao volonter</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
