<main class="login-page">
  <section class="login-panel">
    <p class="eyebrow">Shelter administration</p>
    <h1>Welcome back.</h1>
    <p class="intro">Sign in to manage organizations and animals.</p>

    @if (error) {
      <p class="feedback error" role="alert">{{ error }}</p>
    }

    <form #loginForm="ngForm" (ngSubmit)="submit()">
      <label>
        Username or email
        <input type="text" name="email" [(ngModel)]="email" required autocomplete="username" />
      </label>
      <label>
        Password
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
      </label>
      <button class="button button-primary" type="submit" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>
