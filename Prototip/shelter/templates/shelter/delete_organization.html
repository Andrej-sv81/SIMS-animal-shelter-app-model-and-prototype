{% extends 'shelter/base.html' %}
{% block title %}Obriši organizaciju{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="card-title">Obriši organizaciju</h1>
            <p class="card-text">Jeste li sigurni da želite obrisati organizaciju <strong>{{ organization.name }}</strong>? Ova akcija će je skinuti s popisa aktivnih organizacija.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Potvrdi brisanje</button>
                <a class="btn btn-secondary" href="{% url 'organization_detail' organization.id %}">Odustani</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
